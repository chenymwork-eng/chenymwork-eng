<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="218" viewBox="0 0 1000 218" role="img"><rect width="1000" height="218" rx="20" fill="#101923"/><text x="36" y="43" fill="#7ee4cb" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">HOW I TURN RESEARCH INTO DECISION SUPPORT</text><rect x="28" y="68" width="222" height="125" rx="12" fill="#1b2938"/><text x="42" y="97" fill="#7ee4cb" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">01 / QUESTION</text><text x="42" y="132" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Frame the decision</text><text x="42" y="164" fill="#cad5e2" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">What needs to change?</text><text x="254" y="135" fill="#7ee4cb" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">›</text><rect x="273" y="68" width="222" height="125" rx="12" fill="#1b2938"/><text x="287" y="97" fill="#7ee4cb" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">02 / EVIDENCE</text><text x="287" y="132" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Build &amp; test</text><text x="287" y="164" fill="#cad5e2" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">What does the data support?</text><text x="499" y="135" fill="#7ee4cb" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">›</text><rect x="518" y="68" width="222" height="125" rx="12" fill="#1b2938"/><text x="532" y="97" fill="#7ee4cb" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">03 / INTERPRETATION</text><text x="532" y="132" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Explain the finding</text><text x="532" y="164" fill="#cad5e2" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">What matters, and why